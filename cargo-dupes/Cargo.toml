[package]
name = "cargo-dupes"
version.workspace = true
edition = { workspace = true }
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version = { workspace = true }
description = "A cargo subcommand that detects duplicate and near-duplicate code blocks in Rust codebases using AST normalization"
readme.workspace = true
keywords = ["cargo", "duplicates", "code-quality", "lint", "ast"]
categories = ["development-tools::cargo-plugins", "development-tools"]

[lints]
workspace = true

[dependencies]
dupes-core = { workspace = true, features = ["cli"] }
dupes-rust = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
dupes-cli-test-support = { path = "../dupes-cli-test-support" , version = "0.3.0" }
predicates = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
cargo-husky = { workspace = true }
strict-test-support = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
